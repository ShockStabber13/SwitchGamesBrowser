<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Switch Games Browser · Preview</title>
<style>
:root{color-scheme:dark;--accent:#15be19}*{box-sizing:border-box}body{margin:0;background:#000;color:white;font:15px system-ui,sans-serif}main{max-width:1280px;margin:auto;padding:30px}header{display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:32px;letter-spacing:2px;color:var(--accent);margin:0}p{color:#aaa;line-height:1.5}button,select,input{background:#121212;color:#fff;border:1px solid #383838;padding:11px 14px;border-radius:5px;font:inherit}button{cursor:pointer}button:hover,button:focus,input:focus,select:focus{outline:2px solid var(--accent);outline-offset:2px}.tools{display:flex;flex-wrap:wrap;gap:10px;margin:25px 0}input[type=search]{flex:1;min-width:160px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.card{padding:0;text-align:left;overflow:hidden;border-radius:8px;background:#111;position:relative}.cover{height:145px;display:flex;align-items:center;justify-content:center;background:linear-gradient(125deg,#042906,#071208);color:var(--accent);font-size:28px;font-weight:700;letter-spacing:2px}.cover img{width:100%;height:100%;object-fit:cover}.body{padding:15px}.title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.score{color:var(--accent);margin-top:10px}.meta{color:#999;font-size:12px;margin-top:8px}.badge{position:absolute;right:10px;top:10px;background:black;border:1px solid var(--accent);padding:4px 8px;color:var(--accent)}dialog{background:#080808;color:white;border:1px solid var(--accent);border-radius:12px;max-width:800px;width:90%;padding:28px}dialog::backdrop{background:#000b}dialog h2{color:var(--accent)}dialog .description{max-height:180px;overflow:auto;white-space:pre-wrap}a{color:var(--accent)}.release{border-top:1px solid #333;margin-top:15px;padding-top:15px}.release button{margin-top:12px}.empty{grid-column:1/-1;padding:90px 10px;text-align:center;color:#999}#notice{color:var(--accent)}footer{border-top:1px solid #222;margin-top:30px;padding-top:20px;color:#888;font-size:13px}@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}header{align-items:flex-start;flex-direction:column}}@media(max-width:450px){main{padding:16px}.grid{grid-template-columns:1fr}}
</style></head><body><main>
<header><div><h1>SWITCH GAMES</h1><p>Browser design preview · fictional demo data until you load an index</p></div><button id="load">Load index JSON</button><input type="file" id="file" accept=".json,application/json" hidden></header>
<div class="tools"><input type="search" id="search" placeholder="Search games" aria-label="Search games"><select id="sort" aria-label="Sort"><option value="title">Title A–Z</option><option value="rating">Highest rated</option><option value="date">Newest</option></select><select id="genre" aria-label="Genre"><option value="">All genres</option></select><select id="rating" aria-label="Minimum score"><option value="0">Any score</option><option value="70">70+ score</option><option value="80">80+ score</option><option value="90">90+ score</option></select><select id="votes" aria-label="Minimum votes"><option value="0">Any vote count</option><option value="10">10+ votes</option><option value="50">50+ votes</option><option value="100">100+ votes</option></select><button id="favourites" aria-pressed="false">Favourites</button><button id="reset">Reset</button></div>
<p id="notice"></p><div id="grid" class="grid"></div><footer>This preview uses the same index format as the Switch source. Saving a magnet exports a text file; downloading and installation are not implemented.</footer>
<dialog id="details"><button id="close" style="float:right">Close</button><div id="detailContent"></div></dialog>
</main><script>
'use strict';
const demo={schemaVersion:1,platform:'Nintendo Switch',games:[
{id:'demo-1',title:'Demo Quest',rating:90,ratingCount:10,ratingSource:'Fictional test score',releaseDate:'2024-05-01',genres:['Adventure'],summary:'A fictional game used to verify the browser. This score is invented.',releases:[{title:'Demo Quest [NSZ]',magnet:'magnet:?xt=urn:btih:'+'1'.repeat(40),size:'Demo only'}]},
{id:'demo-2',title:'Demo Quest 2',rating:null,ratingCount:0,releaseDate:'',genres:['Adventure'],summary:'A sequel remains separate when matching torrent titles.',releases:[{title:'Demo Quest 2 [NSP]',magnet:'magnet:?xt=urn:btih:'+'2'.repeat(40),size:'Demo only'}]},
{id:'demo-3',title:'Puzzle Garden',rating:70,ratingCount:5,ratingSource:'Fictional test score',releaseDate:'2025-03-15',genres:['Puzzle'],summary:'Another fictional test entry, with an invented score.',releases:[{title:'Puzzle Garden [XCI]',magnet:'magnet:?xt=urn:btih:'+'3'.repeat(40),size:'Demo only'}]}
]};
const $=id=>document.getElementById(id);let games=demo.games,onlyFavourites=false,isDemo=true;
let favourites;try{favourites=new Set(JSON.parse(localStorage.getItem('sgb-favourites')||'[]'))}catch{favourites=new Set()}
function el(tag,text,className){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(className)e.className=className;return e}
function validRating(g){return typeof g.rating==='number'&&Number.isFinite(g.rating)&&g.rating>=0&&g.rating<=100&&g.ratingCount>0}
function score(g){return validRating(g)?Math.round(g.rating)+'/100 · '+g.ratingCount+' votes':'Unrated'}
function saveFavourites(){try{localStorage.setItem('sgb-favourites',JSON.stringify([...favourites]))}catch{}}
function rebuildGenres(){const select=$('genre');select.replaceChildren(new Option('All genres',''));[...new Set(games.flatMap(g=>g.genres||[]))].sort().forEach(g=>select.add(new Option(g,g)))}
function render(){let rows=games.filter(g=>g.title.toLowerCase().includes($('search').value.toLowerCase())&&(!$('genre').value||(g.genres||[]).includes($('genre').value))&&(!+$('rating').value||(validRating(g)&&g.rating>=+$('rating').value))&&(g.ratingCount||0)>=+$('votes').value&&(!onlyFavourites||favourites.has(g.id)));
rows.sort((a,b)=>{if($('sort').value==='rating'){const d=(validRating(b)?b.rating:-1)-(validRating(a)?a.rating:-1);if(d)return d}if($('sort').value==='date'){const d=(b.releaseDate||'').localeCompare(a.releaseDate||'');if(d)return d}return a.title.localeCompare(b.title)});
$('notice').textContent=rows.length+' games'+(isDemo?' · DEMO: fictional games and scores':'');$('grid').replaceChildren();
if(!rows.length)$('grid').append(el('div','No games match your filters.','empty'));
// Keep DOM bounded for large catalogs. Search/filters/sort run across the complete index.
rows.slice(0,200).forEach(g=>{const card=el('button',undefined,'card');const cover=el('div','SWITCH','cover');if(g.coverUrl&&g.coverUrl.startsWith('https://')){const img=el('img');img.src=g.coverUrl;img.alt='';img.loading='lazy';img.referrerPolicy='no-referrer';img.onerror=()=>img.remove();cover.replaceChildren(img)}const body=el('div',undefined,'body');body.append(el('div',g.title,'title'),el('div',score(g),'score'),el('div',(g.genres||[]).join(' · ')||'Genre unknown','meta'));card.append(cover,body);if(favourites.has(g.id))card.append(el('span','Saved','badge'));card.onclick=()=>details(g);$('grid').append(card)});if(rows.length>200)$('grid').append(el('div','Showing the first 200 results. Narrow your search to see others.','empty'))}
function download(text,name){const url=URL.createObjectURL(new Blob([text],{type:'text/plain'}));const a=el('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function details(g){const content=$('detailContent');content.replaceChildren(el('h2',g.title),el('p',score(g)+' · '+(g.ratingSource||'No rating source')),el('p','Release date: '+(g.releaseDate||'Unknown')),el('p',g.summary||'No description','description'));if(g.ratingUrl&&g.ratingUrl.startsWith('https://')){const a=el('a','Rating source');a.href=g.ratingUrl;a.target='_blank';a.rel='noopener noreferrer';content.append(a)}const fav=el('button',favourites.has(g.id)?'Remove favourite':'Save favourite');fav.onclick=()=>{favourites.has(g.id)?favourites.delete(g.id):favourites.add(g.id);saveFavourites();render();details(g)};content.append(el('p','Releases'),fav);(g.releases||[]).forEach((r,i)=>{const box=el('div',undefined,'release');box.append(el('div',r.title),el('p',r.size||'Size unknown'));const save=el('button','Save magnet');save.onclick=()=>download(r.magnet,'switch-release-'+(i+1)+'.magnet');box.append(save);content.append(box)});if(!$('details').open)$('details').showModal()}
$('close').onclick=()=>$('details').close();$('load').onclick=()=>$('file').click();$('file').onchange=async()=>{try{const file=$('file').files[0];if(!file)return;if(file.size>48*1024*1024)throw new Error('Index exceeds 48 MB');const data=JSON.parse(await file.text());if(data.schemaVersion!==1||data.platform!=='Nintendo Switch'||!Array.isArray(data.games)||!data.games.length||data.games.length>20000)throw new Error('Unsupported index format');const ids=new Set();for(const g of data.games){if(!g||typeof g.title!=='string'||typeof g.id!=='string'||ids.has(g.id)||!Array.isArray(g.releases)||!g.releases.length||!Array.isArray(g.genres))throw new Error('Invalid game row');ids.add(g.id)}games=data.games;isDemo=false;rebuildGenres();render()}catch(e){$('notice').textContent='Cannot load index: '+e.message}};
['search','sort','genre','rating','votes'].forEach(id=>$(id).addEventListener('input',render));$('favourites').onclick=()=>{onlyFavourites=!onlyFavourites;$('favourites').setAttribute('aria-pressed',onlyFavourites);render()};$('reset').onclick=()=>{$('search').value='';$('genre').value='';$('sort').value='title';$('rating').value='0';$('votes').value='0';onlyFavourites=false;$('favourites').setAttribute('aria-pressed',false);render()};rebuildGenres();render();
</script></body></html>
