name: Build Switch browser
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build NRO
        run: make -C switch -j2
      - uses: actions/upload-artifact@v4
        with:
          name: SwitchGamesBrowser-NRO
          path: switch/SwitchGamesBrowser.nro
          if-no-files-found: error
