name: Update Switch index

on:
  workflow_dispatch:
  schedule:
    - cron: '30 20 * * *' # 04:30 Singapore time

permissions:
  contents: write

concurrency:
  group: switch-index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install scraper dependencies
        run: python -m pip install --disable-pip-version-check beautifulsoup4

      - uses: actions/cache@v4
        with:
          path: data/provider-releases.json
          key: authorized-provider-${{ github.run_id }}
          restore-keys: authorized-provider-

      - name: Test index pipeline
        run: python -m unittest discover -s tests -v

      - name: Fetch Nintendo Switch catalog from IGDB
        env:
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
        run: python tools/igdb_catalog.py

      - name: Search authorized torrent sources for every IGDB game
        env:
          # Optional JSON secret containing runtime source overrides/additional private sources.
          TORRENT_SOURCES_JSON: ${{ secrets.TORRENT_SOURCES_JSON }}
          TORRENT_SOURCE_1_TOKEN: ${{ secrets.TORRENT_SOURCE_1_TOKEN }}
          TORRENT_SOURCE_2_TOKEN: ${{ secrets.TORRENT_SOURCE_2_TOKEN }}
          TORRENT_SOURCE_3_TOKEN: ${{ secrets.TORRENT_SOURCE_3_TOKEN }}
          TORRENT_SOURCE_4_TOKEN: ${{ secrets.TORRENT_SOURCE_4_TOKEN }}
          TORRENT_SOURCE_5_TOKEN: ${{ secrets.TORRENT_SOURCE_5_TOKEN }}
          TORRENT_SOURCE_6_TOKEN: ${{ secrets.TORRENT_SOURCE_6_TOKEN }}
          TORRENT_SOURCE_7_TOKEN: ${{ secrets.TORRENT_SOURCE_7_TOKEN }}
          TORRENT_SOURCE_8_TOKEN: ${{ secrets.TORRENT_SOURCE_8_TOKEN }}
        run: python tools/authorized_site_scraper.py --workers 8

      - name: Build Switch index
        run: python tools/build_igdb_index.py --allow-shrink

      - name: Commit validated index
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/switch-index.json data/manifest.json data/scraper-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh IGDB Switch catalog'
            git push
          fi
