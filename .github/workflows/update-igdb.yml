name: Update IGDB catalog

on:
  workflow_dispatch:
  schedule:
    - cron: '0 20 * * *'   # 04:00 Singapore

permissions:
  contents: write

concurrency:
  group: update-igdb
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install cover builder dependencies
        run: python -m pip install --disable-pip-version-check pillow

      - name: Test IGDB pipeline
        run: python -m unittest discover -s tests -v

      - name: Fetch Nintendo Switch catalog from IGDB
        env:
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
        run: python tools/igdb_catalog.py

      - name: Build IGDB cover packs
        run: python tools/build_cover_pack.py

      - name: Commit IGDB catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/igdb-switch-games.json
          git add data/covers-manifest.json
          git add data/covers-*.pack

          if git diff --cached --quiet; then
            echo "No IGDB changes."
          else
            git commit -m "Refresh IGDB Switch catalog"
            git push
          fi
