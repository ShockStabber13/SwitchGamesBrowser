name: Scrape torrents

on:
  workflow_dispatch:

  workflow_run:
    workflows:
      - Update IGDB catalog
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: scrape-torrents
  cancel-in-progress: false

jobs:
  scrape:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install scraper dependencies
        run: python -m pip install --disable-pip-version-check beautifulsoup4

      - name: Test scraper pipeline
        run: python -m unittest discover -s tests -v

      - name: Scrape providers
        run: python tools/authorized_site_scraper.py --workers 8

      - name: Save scraper checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: scraper-checkpoint-${{ github.run_id }}
          path: |
            data/provider-releases.json
            data/scraper-status.json
          compression-level: 9
          retention-days: 14

      - name: Build Switch index
        run: python tools/build_igdb_index.py --allow-shrink

      - name: Commit torrent index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/provider-releases.json \
            data/switch-index.json \
            data/manifest.json \
            data/scraper-status.json

          if git diff --cached --quiet; then
            echo "No torrent/index changes."
          else
            git commit -m "Refresh torrent index"
            git push
          fi
